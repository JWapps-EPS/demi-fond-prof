<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Vérif observateurs – course</title>
<style>
*{box-sizing:border-box}
html{height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;margin:0;font-family:system-ui,sans-serif;background:#f4f4f5;color:#111;-webkit-user-select:none;user-select:none}
nav{display:flex;flex:none;background:#111}
nav button{flex:1;padding:10px 4px;border:0;background:none;color:#aaa;font-size:16px}
nav button.on{color:#fff;border-bottom:3px solid #fff}
section{flex:1;min-height:0;overflow-y:auto;width:100%;padding:8px;max-width:760px;margin:0 auto}
section[hidden]{display:none!important}
#course{display:flex;flex-direction:column;overflow:hidden;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#clock{font-size:clamp(30px,8vh,64px);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
#status{text-align:center;color:#555;margin:2px 0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;margin:6px 0}
.row button,.btn{flex:1;padding:12px 4px;font-size:15px;border:0;border-radius:10px;background:#111;color:#fff}
#undo,#reset{background:#71717a}#stop{background:#b91c1c}
button:disabled{opacity:.35}
#cards{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.card{flex:1;min-height:0;display:flex;border-radius:14px;overflow:hidden;color:#fff;touch-action:manipulation}
.card.flash{filter:brightness(1.6)}
.main{flex:1;min-width:0;padding:2px 14px;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.main b{font-size:clamp(17px,3.4vh,28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main small{font-size:clamp(11px,1.9vh,15px);opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz{width:96px;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.3);font-size:15px;font-weight:600;white-space:pre-line}
.pz.act{background:#111}
.pz.off{opacity:.5}
label{display:block;margin:12px 0 4px;font-weight:600}
input,select{width:100%;padding:12px;font-size:17px;border:1px solid #bbb;border-radius:8px;background:#fff}
input[type=checkbox]{width:auto;transform:scale(1.4);margin-right:10px}
dialog{border:0;border-radius:14px;width:min(92vw,400px);padding:16px}
.res{background:#fff;border-radius:14px;padding:12px;margin:10px 0;border-left:10px solid}
.res h3{margin:0 0 4px}
.res p{margin:4px 0;font-size:14px}
.ch{width:100%;height:auto;display:block;margin-top:6px}
.ch text{font-size:10px;fill:#333}
h4{margin:10px 0 0;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
td,th{border:1px solid #ddd;padding:4px;text-align:center}
.hint{color:#555;font-size:13px}
</style>
</head>
<body>
<nav><button data-tab="course" class="on">Course</button><button data-tab="res">Résultats</button><button data-tab="param">Paramètres</button></nav>

<section id="course">
  <div id="clock">12:00</div>
  <div id="status"></div>
  <div class="row"><button id="go">▶ Départ</button><button id="undo">↩ Annuler</button><button id="stop">■ Terminer</button><button id="reset">⟲ Nouvelle</button></div>
  <div id="cards"></div>
</section>

<section id="res" hidden>
  <div class="row"><button id="xlsx">⬇ Export Excel (.xlsx)</button></div>
  <div id="out"></div>
</section>

<section id="param" hidden>
  <label>Durée de la course (min)</label><input id="c_dur" type="number" step="0.5" min="1">
  <label>Distance du tour (m)</label><input id="c_lap" type="number" min="10">
  <label>Distance entre 2 plots (m)</label><input id="c_plot" type="number" min="1">
  <label>Durée d'une tranche d'observation (s)</label><input id="c_slice" type="number" min="10">
  <label>Durée d'une pause (s) – sert à la détection automatique</label><input id="c_pause" type="number" min="10">
  <label>Nombre d'élèves suivis</label><input id="c_nb" type="number" min="1" max="8">
  <label style="font-weight:400"><input id="c_start" type="checkbox">Les élèves partent de mon point d'observation</label>
  <p class="hint">Si la case est décochée, le 1er appui sur un élève sert seulement de repère (le 1er tour mesuré commence là).</p>
</section>

<dialog id="dlg">
  <label>Nom de l'élève</label><input id="e_name" autocomplete="off">
  <label>VMA validée (km/h) – facultatif</label><input id="e_vma" type="number" step="0.5">
  <label>Projet</label>
  <select id="e_proj"><option value="0">Vert – 0 pause (VMA −3)</option><option value="1">Jaune – 1 pause (VMA −2)</option><option value="2">Orange – 2 pauses (VMA −1)</option></select>
  <div class="row"><button class="btn" id="e_ok">OK</button></div>
</dialog>

<script>
// ================= CALCULS (sans DOM) =================
function overlap(a,b,c,d){return Math.max(0,Math.min(b,d)-Math.max(a,c));}
function median(a){const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
const r1=x=>x==null||!isFinite(x)?null:Math.round(x*10)/10;

// st:{laps:[s],pauses:[{a,n}],proj,vma}  cfg:{lap,plot,slice,pause,startAtPoint}  D: durée réelle (s)
function calc(st,cfg,D){
  const P=cfg.pause,L=cfg.lap;
  const pts=(cfg.startAtPoint?[0]:[]).concat(st.laps);
  const pauses=[];
  const pin=(a,b)=>pauses.reduce((s,p)=>s+overlap(a,b,p.a,p.b),0);
  const mk=()=>pts.slice(1).map((b,i)=>{const a=pts[i],pt=pin(a,b),run=Math.max(1,b-a-pt);return{a,b,pause:pt,run,v:L/run*3.6};});
  let segs=mk();
  // Pauses déduites automatiquement : un tour contient une pause seulement s'il dure au moins
  // une pause complète + 80 % d'un tour habituel (sinon c'est de la marche / un ralentissement → tour lent).
  // On en cherche au maximum autant que prévu au projet ; 2 pauses d'affilée = 2 pauses dans le même tour.
  let missing=st.maxP!=null?st.maxP:st.proj;
  while(missing-->0&&segs.length>1){
    const q=segs.map(s=>s.run).sort((x,y)=>x-y),m=q[Math.floor((q.length-1)/4)],s=segs.reduce((x,y)=>y.run>x.run?y:x);
    if(s.run<P+0.8*m)break;
    let a=Math.max(s.a,Math.ceil(s.a/cfg.slice)*cfg.slice);
    [...pauses].sort((x,y)=>x.a-y.a).forEach(p=>{if(overlap(a,a+P,p.a,p.b)>0)a=p.b;});
    a=Math.max(s.a,Math.min(a,s.b-P));
    pauses.push({a,b:a+P,est:true});segs=mk();
  }
  const n=segs.length;
  function d(t){ // distance cumulée estimée (m) à l'instant t
    if(!n)return 0;
    if(t<=pts[0])return -(segs[0].v/3.6)*(pts[0]-t);
    if(t>=pts[n])return n*L+(segs[n-1].v/3.6)*Math.max(0,t-pts[n]-pin(pts[n],t));
    let i=0;while(t>segs[i].b)i++;
    const s=segs[i];return i*L+L*Math.min(1,Math.max(0,t-s.a-pin(s.a,t))/s.run);
  }
  const slices=[];
  for(let a=0;a<D-0.5;a+=cfg.slice){
    const b=Math.min(D,a+cfg.slice),pt=pin(a,b),dist=d(b)-d(a),run=b-a-pt;
    slices.push({a,b,pause:pt,dist,plots:dist/cfg.plot,v:run>5?dist/run*3.6:null,rest:pt>(b-a)/2,
      est:n>0&&(a<pts[0]-1e-6||b>pts[n]+1e-6)});
  }
  const pauseTot=pin(0,D),dist=n?d(D)-d(0):0;
  const target=st.vma?st.vma-3+st.proj:null;
  const tPlots=target?target/3.6*cfg.slice/cfg.plot:null;
  const under=tPlots?slices.filter(s=>!s.rest&&s.pause<1&&s.plots<tPlots-0.5).length:null;
  return{n,segs,pauses,slices,dist,pauseTot,target,tPlots,under,
    vmoy:n&&D-pauseTot>0?dist/(D-pauseTot)*3.6:null,nPause:pauses.length};
}

// ---- mini générateur .xlsx avec graphiques (zip non compressé, sans dépendance) ----
function chartXml(c,q){
  const rg=col=>`${q}$${col}$2:$${col}$${c.n+1}`,hd=col=>`${q}$${col}$1`;
  const ax='<c:axId val="1"/><c:axId val="2"/>',cat=`<c:cat><c:strRef><c:f>${rg(c.cat)}</c:f></c:strRef></c:cat>`;
  const ser=(i,col,extra,end)=>`<c:ser><c:idx val="${i}"/><c:order val="${i}"/><c:tx><c:strRef><c:f>${hd(col)}</c:f></c:strRef></c:tx>${extra}${cat}<c:val><c:numRef><c:f>${rg(col)}</c:f></c:numRef></c:val>${end}</c:ser>`;
  const axc='<c:delete val="0"/>',tk='<c:numFmt formatCode="General" sourceLinked="0"/><c:majorTickMark val="out"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><c:chart>'+
  `<c:title><c:tx><c:rich><a:bodyPr/><a:p><a:r><a:rPr lang="fr-FR" sz="1200"/><a:t>${c.title}</a:t></a:r></a:p></c:rich></c:tx><c:overlay val="0"/></c:title><c:autoTitleDeleted val="0"/><c:plotArea><c:layout/>`+
  '<c:barChart><c:barDir val="col"/><c:grouping val="clustered"/><c:varyColors val="0"/>'+
  ser(0,c.val,`<c:spPr><a:solidFill><a:srgbClr val="${c.color}"/></a:solidFill></c:spPr><c:invertIfNegative val="0"/><c:dLbls><c:showLegendKey val="0"/><c:showVal val="1"/><c:showCatName val="0"/><c:showSerName val="0"/><c:showPercent val="0"/><c:showBubbleSize val="0"/></c:dLbls>`,'')+
  `<c:gapWidth val="40"/>${ax}</c:barChart>`+
  (c.tgt?'<c:lineChart><c:grouping val="standard"/><c:varyColors val="0"/>'+ser(1,c.tgt,'<c:spPr><a:ln w="28575"><a:solidFill><a:srgbClr val="111111"/></a:solidFill><a:prstDash val="dash"/></a:ln></c:spPr><c:marker><c:symbol val="none"/></c:marker>','<c:smooth val="0"/>')+`<c:marker val="1"/>${ax}</c:lineChart>`:'')+
  `<c:catAx><c:axId val="1"/><c:scaling><c:orientation val="minMax"/></c:scaling>${axc}<c:axPos val="b"/>${tk}<c:crossAx val="2"/><c:crosses val="autoZero"/><c:auto val="1"/><c:lblAlgn val="ctr"/><c:lblOffset val="100"/><c:noMultiLvlLbl val="0"/></c:catAx>`+
  `<c:valAx><c:axId val="2"/><c:scaling><c:orientation val="minMax"/><c:min val="0"/></c:scaling>${axc}<c:axPos val="l"/><c:majorGridlines/>${tk}<c:crossAx val="1"/><c:crosses val="autoZero"/><c:crossBetween val="between"/></c:valAx>`+
  '</c:plotArea><c:legend><c:legendPos val="b"/><c:overlay val="0"/></c:legend><c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart></c:chartSpace>';
}
function makeXlsx(sheets){
  const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const M='http://schemas.openxmlformats.org/spreadsheetml/2006/main',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const rels=a=>X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+a.map((r,i)=>`<Relationship Id="rId${i+1}" Type="${R}/${r[0]}" Target="${r[1]}"/>`).join('')+'</Relationships>';
  const sh=(rows,dr)=>X+`<worksheet xmlns="${M}" xmlns:r="${R}"><sheetData>`+rows.map(r=>'<row>'+r.map(c=>c==null||c===''?'<c/>':typeof c==='number'&&isFinite(c)?`<c><v>${c}</v></c>`:`<c t="inlineStr"><is><t>${e(c)}</t></is></c>`).join('')+'</row>').join('')+'</sheetData>'+(dr?'<drawing r:id="rId1"/>':'')+'</worksheet>';
  const files=[],ov=[['/xl/workbook.xml','spreadsheetml.sheet.main']];let nd=0,nc=0;
  sheets.forEach((s,i)=>{
    const ch=s.charts||[];
    files.push([`xl/worksheets/sheet${i+1}.xml`,sh(s.rows,ch.length)]);ov.push([`/xl/worksheets/sheet${i+1}.xml`,'spreadsheetml.worksheet']);
    if(!ch.length)return;
    nd++;files.push([`xl/worksheets/_rels/sheet${i+1}.xml.rels`,rels([['drawing',`../drawings/drawing${nd}.xml`]])]);
    const q="'"+s.name+"'!",ids=ch.map(c=>{nc++;files.push([`xl/charts/chart${nc}.xml`,chartXml(c,q)]);ov.push([`/xl/charts/chart${nc}.xml`,'drawingml.chart']);return nc;});
    const pos=(c,r)=>`<xdr:col>${c}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${r}</xdr:row><xdr:rowOff>0</xdr:rowOff>`;
    files.push([`xl/drawings/drawing${nd}.xml`,X+'<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">'+
      ch.map((c,j)=>`<xdr:twoCellAnchor><xdr:from>${pos(12,j*18)}</xdr:from><xdr:to>${pos(22,j*18+17)}</xdr:to><xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="${j+2}" name="Graphique ${j+1}"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr><xdr:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></xdr:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:r="${R}" r:id="rId${j+1}"/></a:graphicData></a:graphic></xdr:graphicFrame><xdr:clientData/></xdr:twoCellAnchor>`).join('')+'</xdr:wsDr>']);
    ov.push([`/xl/drawings/drawing${nd}.xml`,'drawing']);
    files.push([`xl/drawings/_rels/drawing${nd}.xml.rels`,rels(ids.map(k=>['chart',`../charts/chart${k}.xml`]))]);
  });
  files.unshift(
    ['[Content_Types].xml',X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>'+ov.map(o=>`<Override PartName="${o[0]}" ContentType="application/vnd.openxmlformats-officedocument.${o[1]}+xml"/>`).join('')+'</Types>'],
    ['_rels/.rels',rels([['officeDocument','xl/workbook.xml']])],
    ['xl/workbook.xml',X+`<workbook xmlns="${M}" xmlns:r="${R}"><sheets>`+sheets.map((s,i)=>`<sheet name="${e(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels',rels(sheets.map((s,i)=>['worksheet',`worksheets/sheet${i+1}.xml`]))]);
  const enc=new TextEncoder(),T=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[i]=c>>>0;}
  const crc=u=>{let c=~0;for(let i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return(~c)>>>0;};
  const parts=[],cen=[];let off=0;
  for(const[name,txt]of files){
    const nm=enc.encode(name),data=enc.encode(txt),c=crc(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,33,true);
    h.setUint32(14,c,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);
    const k=new DataView(new ArrayBuffer(46));
    k.setUint32(0,0x02014b50,true);k.setUint16(4,20,true);k.setUint16(6,20,true);k.setUint16(8,0x0800,true);k.setUint16(14,33,true);
    k.setUint32(16,c,true);k.setUint32(20,data.length,true);k.setUint32(24,data.length,true);k.setUint16(28,nm.length,true);k.setUint32(42,off,true);
    parts.push(new Uint8Array(h.buffer),nm,data);cen.push(new Uint8Array(k.buffer),nm);
    off+=30+nm.length+data.length;
  }
  const cs=cen.reduce((s,u)=>s+u.length,0),z=new DataView(new ArrayBuffer(22));
  z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cs,true);z.setUint32(16,off,true);
  const all=[...parts,...cen,new Uint8Array(z.buffer)],out=new Uint8Array(all.reduce((s,u)=>s+u.length,0));
  let p=0;for(const u of all){out.set(u,p);p+=u.length;}
  return out;
}

const PROJ=['0 pause','1 pause','2 pauses'];
const COLORS=['#2563eb','#dc2626','#15803d','#c2410c','#7e22ce','#0e7490','#be185d','#4d7c0f'];
function exportSheets(S,D){
  const lb=s=>Math.floor(s/60)+"'"+String(Math.round(s%60)).padStart(2,'0');
  const syn=[['Élève','VMA','Projet','Allure cible (km/h)','Passages pointés','Distance estimée (m)','Pauses détectées','Pause déduite (s)','Vitesse moyenne en course (km/h)','Tranches sous la cible (estim.)']];
  const tr=[['Élève','Tranche n°','Début (s)','Fin (s)','Plots estimés','Distance (m)','Vitesse (km/h)','Pause (s)','Extrapolé']];
  const to=[['Élève','Tour n°','Passage (s)','Temps du tour (s)','Pause déduite (s)','Temps de course (s)','Vitesse (km/h)']];
  const per=[];
  S.st.forEach((st,i)=>{
    const c=calc(st,S.cfg,D);
    syn.push([st.name,st.vma||'',PROJ[st.proj],c.target||'',st.laps.length,r1(c.dist),c.nPause,r1(c.pauseTot),r1(c.vmoy),c.under==null?'':c.under]);
    if(!c.n)return;
    c.slices.forEach((s,k)=>tr.push([st.name,k+1,s.a,s.b,r1(s.plots),r1(s.dist),r1(s.v),r1(s.pause),s.est?'oui':'']));
    c.segs.forEach((s,k)=>to.push([st.name,k+1,r1(s.b),r1(s.b-s.a),r1(s.pause),r1(s.run),r1(s.v)]));
    const rows=[['Tranche (fin)','Plots estimés','Cible (plots)','Vitesse (km/h)','Pause (s)','','Tour','Vitesse (km/h)','Cible (km/h)','Temps du tour (s)','Pause déduite (s)']];
    for(let k=0;k<Math.max(c.slices.length,c.n);k++){
      const s=c.slices[k],g=c.segs[k];
      rows.push((s?[lb(s.b),r1(s.plots),r1(c.tPlots)||'',r1(s.v)||'',r1(s.pause)]:['','','','','']).concat([''],g?['T'+(k+1),r1(g.v),c.target||'',r1(g.b-g.a),r1(g.pause)]:[]));
    }
    const col=COLORS[i%COLORS.length].slice(1).toUpperCase(),t=c.target?1:0;
    per.push({name:(i+1)+' '+st.name.replace(/[\[\]:*?\/\\'&<>"]/g,' ').slice(0,27),rows,charts:[
      {title:'Plots par tranche (à comparer à la fiche)',cat:'A',val:'B',tgt:t&&'C',n:c.slices.length,color:col},
      {title:'Vitesse par tour, pauses déduites (km/h)',cat:'G',val:'H',tgt:t&&'I',n:c.n,color:col}]});
  });
  const par=[['Durée (min)',r1(D/60)],['Tour (m)',S.cfg.lap],['Entre plots (m)',S.cfg.plot],['Tranche (s)',S.cfg.slice],['Pause (s)',S.cfg.pause],['Départ au point d\'observation',S.cfg.startAtPoint?'oui':'non']];
  return[{name:'Synthèse',rows:syn},...per,{name:'Tranches',rows:tr},{name:'Tours',rows:to},{name:'Paramètres',rows:par}];
}
//==UI==
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const lab=s=>{s=Math.round(s);return Math.floor(s/60)+"'"+(s%60?String(s%60).padStart(2,'0'):'');};
const fr=x=>x==null?'–':String(r1(x)).replace('.',',');

let S={cfg:{dur:12,lap:200,plot:25,slice:90,pause:90,startAtPoint:true},st:[],t0:null,stopT:null,log:[]};
try{const j=JSON.parse(localStorage.getItem('verifCourse'));if(j&&j.cfg)S=j;}catch(e){}
function fit(n){while(S.st.length<n)S.st.push({name:'Élève '+(S.st.length+1),vma:null,proj:0,laps:[],pauses:[]});S.st.length=n;}
if(!S.st.length)fit(5);
const save=()=>{try{localStorage.setItem('verifCourse',JSON.stringify(S));}catch(e){}};
const running=()=>S.t0!=null&&S.stopT==null;
const now=()=>(Date.now()-S.t0)/1000;
const DUR=()=>S.stopT!=null?S.stopT:S.cfg.dur*60;
const flash={};

function draw(){
  const run=running(),t=run?now():0;
  $('clock').textContent=fmt(S.t0==null?S.cfg.dur*60:run?S.cfg.dur*60-t:0);
  $('status').textContent=S.t0==null?'Touchez un élève pour régler nom / VMA / projet':run?'Un appui à chaque passage devant vous':'Course terminée – voir Résultats';
  $('go').disabled=S.t0!=null;$('stop').disabled=!run;$('undo').disabled=!run||!S.log.length;
  $('cards').innerHTML=S.st.map((st,i)=>{
    let info='Tours : 0';
    if(S.t0!=null){const c=calc(st,S.cfg,run?Math.max(t,1):DUR()),l=c.segs[c.n-1];info='Passages : '+st.laps.length+(l?' · dernier tour '+fmt(l.run)+' → '+fr(l.v)+' km/h':'');}
    const pz='';
    return `<div class="card${Date.now()-(flash[i]||0)<250?' flash':''}" style="background:${COLORS[i]}"><div class="main" data-l="${i}"><b>${esc(st.name)}</b><small>${PROJ[st.proj]}${st.vma?' · VMA '+fr(st.vma)+' → cible '+fr(st.vma-3+st.proj)+' km/h':''}<br>${info}</small></div>${pz}</div>`;
  }).join('');
}

$('cards').addEventListener('pointerdown',e=>{
  if(!running())return;
  const L=e.target.closest('[data-l]'),t=now();
  if(L){const i=+L.dataset.l,st=S.st[i];if(st.laps.length&&t-st.laps[st.laps.length-1]<3)return;
    st.laps.push(t);S.log.push({i,k:'l'});flash[i]=Date.now();navigator.vibrate&&navigator.vibrate(30);}
  else return;
  save();draw();
});
let editing=-1;
$('cards').addEventListener('click',e=>{
  const L=e.target.closest('[data-l]');if(!L||S.t0!=null)return;
  editing=+L.dataset.l;const st=S.st[editing];
  $('e_name').value=st.name;$('e_vma').value=st.vma||'';$('e_proj').value=st.proj;$('dlg').showModal();
});
$('e_ok').onclick=()=>{const st=S.st[editing];st.name=$('e_name').value.trim()||'Élève '+(editing+1);st.vma=parseFloat($('e_vma').value)||null;st.proj=+$('e_proj').value;delete st.maxP;$('dlg').close();save();draw();};

$('go').onclick=()=>{S.t0=Date.now();S.stopT=null;S.log=[];save();draw();try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}};
$('stop').onclick=()=>{if(confirm('Terminer la course maintenant ?'))finish();};
$('undo').onclick=()=>{const a=S.log.pop();if(!a)return;const st=S.st[a.i];
  st.laps.pop();
  save();draw();};
$('reset').onclick=()=>{if(!confirm('Nouvelle course : effacer tous les passages ? (noms et projets conservés)'))return;
  S.t0=null;S.stopT=null;S.log=[];S.st.forEach(s=>{s.laps=[];s.pauses=[];delete s.maxP;});save();draw();};
function finish(){
  S.stopT=Math.min(now(),S.cfg.dur*60);save();
  navigator.vibrate&&navigator.vibrate([300,100,300]);
  try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.8);}catch(e){}
  show('res');
}
setInterval(()=>{if(running()){if(now()>=S.cfg.dur*60)finish();else draw();}},250);

// ---- graphiques ----
function chart(items,target,color){
  const W=340,H=170,l=24,b=22,t=14,w=(W-l-2)/items.length;
  const max=Math.max(target||0,...items.map(x=>x.val||0),1)*1.15,y=v=>t+(H-t-b)*(1-v/max),step=max>12?4:max>6?2:1;
  let g='';
  for(let v=0;v<=max;v+=step)g+=`<line x1="${l}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#ddd"/><text x="${l-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  items.forEach((it,i)=>{const x=l+i*w+2,bw=w-4,cx=x+bw/2;
    if(it.rest)g+=`<rect x="${x}" y="${t}" width="${bw}" height="${H-t-b}" fill="#e5e5e5"/><text x="${cx}" y="${t+12}" text-anchor="middle">pause</text>`;
    if(it.val>0.05)g+=`<rect x="${x}" y="${y(it.val)}" width="${bw}" height="${y(0)-y(it.val)}" fill="${color}" opacity="${it.est?.45:1}"/><text x="${cx}" y="${y(it.val)-2}" text-anchor="middle">${fr(it.val)}</text>`;
    g+=`<text x="${cx}" y="${H-7}" text-anchor="middle">${it.label}</text>`;});
  if(target)g+=`<line x1="${l}" x2="${W}" y1="${y(target)}" y2="${y(target)}" stroke="#111" stroke-dasharray="5 3"/><text x="${W-2}" y="${y(target)-3}" text-anchor="end" style="font-weight:700">cible ${fr(target)}</text>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function results(){
  if(S.t0==null){$('out').innerHTML='<p class="hint">Aucune course enregistrée.</p>';return;}
  const D=running()?Math.max(now(),1):DUR();
  $('out').innerHTML=(running()?'<p class="hint">Course en cours – résultats provisoires.</p>':'')+S.st.map((st,i)=>{
    const c=calc(st,S.cfg,D);
    let h=`<div class="res" style="border-color:${COLORS[i]}"><h3>${esc(st.name)}</h3><p>${PROJ[st.proj]}${st.vma?' · VMA '+fr(st.vma)+' · cible '+fr(c.target)+' km/h':''}</p>`;
    if(!c.n)return h+'<p class="hint">Pas assez de passages pointés.</p></div>';
    h+=`<p><b>${fr(c.vmoy)} km/h</b> en moyenne (hors pauses) · ≈ ${Math.round(c.dist)} m · pause déduite ${fmt(c.pauseTot)}${c.under!=null?' · <b>'+c.under+'</b> tranche(s) sous la cible (estim.)':''}</p>`;
    const mx=st.maxP!=null?st.maxP:st.proj,sl=c.segs.map((s,k)=>s.pause>0?k+1:0).filter(Boolean);
    h+=`<p class="hint">${c.nPause<st.proj?'⚠ ':''}Pauses détectées : <b>${c.nPause}</b>${sl.length?' (tour '+sl.join(', ')+')':''} · maximum à retenir : <select data-mx="${i}" style="width:auto;padding:4px">${[0,1,2].map(k=>`<option value="${k}"${k==mx?' selected':''}>${k}${k==st.proj?' (projet)':''}</option>`).join('')}</select><br>Un tour lent sans pause détectée = marche ou ralentissement. Si l'élève a marché et que l'app a compté une pause, baissez le maximum.</p>`;
    h+=`<h4>Plots par tranche (à comparer à la fiche de l'observateur)</h4>`+chart(c.slices.map(s=>({label:lab(s.b),val:s.plots,rest:s.rest,est:s.est})),c.tPlots,COLORS[i]);
    h+=`<h4>Vitesse par tour (km/h, pauses déduites)</h4>`+chart(c.segs.map((s,k)=>({label:(k+1)+(s.pause>0?'*':''),val:s.v})),c.target,COLORS[i]);
    h+=`<p class="hint">Barres claires = tranche en partie extrapolée (avant le 1er ou après le dernier passage). * = tour avec pause déduite.</p>`;
    h+=`<details><summary>Détail</summary><table><tr><th>Tranche</th><th>Plots</th><th>km/h</th><th>Pause</th></tr>`+c.slices.map(s=>`<tr><td>${lab(s.a)}–${lab(s.b)}</td><td>${fr(s.plots)}${s.est?' ~':''}</td><td>${fr(s.v)}</td><td>${s.pause>0?fmt(s.pause):''}</td></tr>`).join('')+
      `</table><table><tr><th>Tour</th><th>Passage</th><th>Temps</th><th>Pause</th><th>km/h</th></tr>`+c.segs.map((s,k)=>`<tr><td>${k+1}</td><td>${fmt(s.b)}</td><td>${fmt(s.b-s.a)}</td><td>${s.pause>0?fmt(s.pause):''}</td><td>${fr(s.v)}</td></tr>`).join('')+`</table></details>`;
    return h+'</div>';
  }).join('');
}
$('out').addEventListener('change',e=>{const i=e.target.dataset.mx;if(i==null)return;S.st[i].maxP=+e.target.value;save();results();});
$('xlsx').onclick=()=>{
  if(S.t0==null)return alert('Aucune course à exporter.');
  const u=makeXlsx(exportSheets(S,running()?now():DUR()));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download='verif-course-'+new Date().toISOString().slice(0,10)+'.xlsx';document.body.appendChild(a);a.click();a.remove();
};

// ---- onglets & paramètres ----
function show(tab){document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==tab);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='res')results();if(tab==='course')draw();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
const F={c_dur:'dur',c_lap:'lap',c_plot:'plot',c_slice:'slice',c_pause:'pause'};
for(const id in F){$(id).value=S.cfg[F[id]];$(id).onchange=()=>{const v=parseFloat($(id).value);if(v>0){S.cfg[F[id]]=v;save();draw();}else $(id).value=S.cfg[F[id]];};}
$('c_nb').value=S.st.length;
$('c_nb').onchange=()=>{if(running()){$('c_nb').value=S.st.length;return alert('Impossible pendant la course.');}
  fit(Math.min(8,Math.max(1,parseInt($('c_nb').value)||5)));$('c_nb').value=S.st.length;save();draw();};
$('c_start').checked=S.cfg.startAtPoint;$('c_start').onchange=()=>{S.cfg.startAtPoint=$('c_start').checked;save();};
draw();
</script>
